<!DOCTYPE html>
<html>
<head>
    <title>Parking System</title>
</head>
<body style="background: #121212; color: white;">

<h2>Add Vehicle</h2>

<input type="text" id="vehicle_no" placeholder="Vehicle Number"><br><br>
<input type="text" id="vehicle_type" placeholder="Vehicle Type"><br><br>
<input type="text" id="owner_name" placeholder="Owner Name"><br><br>

<button onclick="addVehicle()">Submit</button>

<script>
function addVehicle() {
    fetch("http://127.0.0.1:5000/api/add_vehicle", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            vehicle_no: document.getElementById("vehicle_no").value,
            vehicle_type: document.getElementById("vehicle_type").value,
            owner_name: document.getElementById("owner_name").value
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        console.log(data);
    })
    .catch(err => console.log("Error:", err));
}
</script>

</body>
</html>
